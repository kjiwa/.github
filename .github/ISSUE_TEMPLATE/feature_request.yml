name: Feature request
description: Propose a change to this repo's behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do that the repo doesn't support today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd like to see, and why it fits the repo's stated scope.
    validations:
      required: true
