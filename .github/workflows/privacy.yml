name: privacy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for machine-local home directory paths
        run: |
          set -eu
          matches=$(git grep -I -n -o -E '(/(Users|home)/|[A-Za-z]:\\Users\\)[A-Za-z0-9_.-]+' \
            | grep -v -E '/(Users|home)/(user|runner)$' || true)
          if [ -n "$matches" ]; then
            echo "$matches" | while IFS= read -r line; do
              echo "::error::machine-local path found: $line"
            done
            exit 1
          fi
      - name: Check for home-relative paths and identifiers naming the owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          pattern='(~|\$\{?HOME\}?|/(Users|home)/[^/[:space:]]+)/[^[:space:]"]*'"$OWNER"'|com\.'"$OWNER"'\.'
          matches=$(git grep -I -n -o -E "$pattern" \
            | grep -v -E ':/(Users|home)/(user|runner)/' || true)
          if [ -n "$matches" ]; then
            echo "$matches" | while IFS= read -r line; do
              echo "::error::owner-specific path or identifier found: $line"
            done
            exit 1
          fi
      - name: Check commit author and committer emails
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == github.repository_owner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          matches=$(git log --format='%h %ae %ce' "$BASE_SHA..$HEAD_SHA" \
            | awk '{ for (i = 2; i <= 3; i++) if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com") { print; break } }')
          if [ -n "$matches" ]; then
            echo "$matches" | while IFS= read -r line; do
              echo "::error::commit uses a non-noreply email: $line"
            done
            exit 1
          fi
      # The CLI, not gitleaks-action: the action calls the PR-commits API with
      # GITHUB_TOKEN, which a caller's contents-only permissions deny, and
      # Dependabot and fork PRs get a read-only token regardless. A flagged
      # value that is not a secret goes in the caller's .gitleaksignore.
      - name: Check history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "${tarball}" gitleaks
          cd "$GITHUB_WORKSPACE"
          gitleaks git . --redact --no-banner -v
